[package]
name = "gol-rust"
version = "0.1.0"
description = "GPU-accelerated Conway's Game of Life and SmoothLife in Rust."
edition = "2024"
repository = "https://github.com/javidahmed64592/gol-rust"
homepage = "https://github.com/javidahmed64592/gol-rust"
license = "MIT"
authors = ["Javid Ahmed <javidahmed@icloud.com>"]

[package.metadata.wix]
upgrade-guid = "F907DF88-7AA9-4257-AD19-515DF69BAAC3"
path-guid = "EF829ECD-A13B-4D95-8332-5847850B2EC3"
license = false
eula = false

[dependencies]
wgpu = "0.20"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
env_logger = "0.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
# Include gol.toml in release archives so users can configure the simulation.
include = ["gol.toml"]
