# Conway's Game of Life — runtime configuration

[window]
width  = 1024
height = 1024

[grid]
width    = 2048
height   = 2048
toroidal = true    # wrap edges; false = dead fixed boundary

[rules]
# Birth: Neighbour counts that cause a dead cell to be born (B rule).
# Survive: Neighbour counts that allow a live cell to survive (S rule).

# Regular Conway's Game of Life: B3/S23
birth   = [3]
survive = [2, 3]

# Other interesting rules (uncomment one block at a time):

# HighLife:
# birth = [3, 6]
# survive = [2, 3]

# Day&Night:
# birth = [3, 6, 7, 8]
# survive = [3, 4, 6, 7, 8]

# Seeds:
# birth = [2]
# survive = []

# Morley:
# birth = [3, 6, 8]
# survive = [2, 4, 5]

[simulation]
ticks_per_second = 10.0  # starting TPS (↑/↓ keys adjust at runtime)
initial_density  = 0.3   # fraction of cells alive on R (random reset)

[visuals]
# RGB colour for dead cells (each component 0.0–1.0).
background_color = [0.02, 0.02, 0.02]

# Hue sweeps start_hue → end_hue as a cell ages 0 → max_lifetime generations.
start_hue    = 200.0   # degrees (0–360) for newly born cells;
end_hue      =  10.0   # degrees (0–360) for long-lived cells;
max_lifetime =  100   # generations for the full hue sweep

# Saturation is driven by live-neighbour density (0 = isolated, 1 = fully surrounded).
sat_min = 0.5
sat_max = 1.0

# Value (brightness) of alive cells.  val_min reserved for energy-based modulation.
val_min = 0.8
val_max = 1.0

# Blur post-process pass (F=toggle, [/]=adjust radius).
blur_enabled = false
blur_radius  = 1.5   # Gaussian sigma in pixels; try 1.0–4.0 for different softness

[smoothlife]
# Set enabled = true to start in SmoothLife mode (toggle at runtime with M).
enabled = false

# Ring kernel: inner disk of radius `inner_radius` computes self-density m;
# annulus out to `outer_radius` computes neighbourhood density n.
# Larger outer_radius → smoother, more fluid behaviour but higher GPU cost.
inner_radius = 2.0
outer_radius = 6.0

# Birth and survival intervals in [0, 1] neighbour-density space.
# These are the classic SmoothLife "glider" parameters.
birth_lo   = 0.278
birth_hi   = 0.365
survive_lo = 0.267
survive_hi = 0.445

# Logistic sigmoid steepness.  Smaller → very fluid/continuous; larger → more GoL-like.
sigmoid_sharpness = 0.028

# Energy level considered "alive" for age tracking and birth/death events.
age_threshold = 0.1

# Preset ideas (uncomment one block to try)
# Larger, more stable blobs:
# inner_radius = 3.0
# outer_radius = 9.0
# birth_lo   = 0.257
# birth_hi   = 0.336
# survive_lo = 0.365
# survive_hi = 0.549
# sigmoid_sharpness = 0.047
#
# Sharp-edged, faster dynamics:
# sigmoid_sharpness = 0.010
